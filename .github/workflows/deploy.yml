name: Deploy Yapper to Oracle Cloud

on:
  push:
    branches: [ "master" ]
    paths:
      - 'yapper-server/**'
      - 'yapper-shared/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Automatically wipe old files and copy fresh source files
      - name: Copy files to Cloud VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          rm: true
          source: "yapper-server/**,yapper-shared/**,docker-compose.yml,pom.xml"
          target: "/home/ubuntu/yapper"

      # 2. Start Docker containers
      - name: Start Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/yapper

            # Generate .env if missing
            if [ ! -f ".env" ]; then
              echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)" > .env
              echo "MYSQL_DATABASE=yapper_db" >> .env
              echo "MYSQL_USER=yapper_user" >> .env
              echo "MYSQL_PASSWORD=$(openssl rand -hex 16)" >> .env
            fi

            # Build and start services
            docker compose down
            docker compose up -d --build