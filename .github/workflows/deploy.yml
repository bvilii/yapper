name: Deploy Yapper to Oracle Cloud

on:
  push:
    branches: [ "master" ]
    paths:
      - 'yapper-server/**'
      - 'yapper-shared/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Copy repository files directly from GitHub runner to the VM
      - name: Copy files to Cloud VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "~/yapper"
          overwrite: true

      # 2. Run Docker on the VM with the transferred files
      - name: Start Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/yapper

            # Generate .env if missing
            if [ ! -f ".env" ]; then
              echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)" > .env
              echo "MYSQL_DATABASE=yapper_db" >> .env
              echo "MYSQL_USER=yapper_user" >> .env
              echo "MYSQL_PASSWORD=$(openssl rand -hex 16)" >> .env
            fi

            # Build and boot containers
            docker compose down
            docker compose up -d --build